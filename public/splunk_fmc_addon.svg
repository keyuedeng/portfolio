    <rect x="58" y="284" width="164" height="36" rx="6" fill="#eef3f8"/><text x="70" y="307">/devices/devicerecords</text>
    <rect x="58" y="336" width="164" height="36" rx="6" fill="#eef3f8"/><text x="70" y="359">/audit/auditrecords</text>
