  <text x="40" y="58" font-size="22" font-weight="bold" fill="#1f2d3d">TA-cisco-fmc</text>
  <text x="40" y="82" font-size="13" fill="#6b7785">Cisco Secure Firewall Management Center → Splunk</text>
  <rect x="40" y="130" width="200" height="300" rx="10" fill="#fff" stroke="#c9d1db"/>
  <text x="140" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">FMC REST API</text>
